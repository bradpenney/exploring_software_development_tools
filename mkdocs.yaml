site_name: "Exploring Software Development Tools"
site_url: https://tools.bradpenney.io
site_description: Essential tools for SREs and platform engineers — Git, jq, yq, terminal IDEs, and productivity tooling that removes friction from infrastructure work.
site_author: Brad Penney
copyright: >-
  Copyright &copy; Brad Penney —
  <a href="#__consent">Change cookie settings</a>

extra:
  analytics:
    provider: google
    property: G-V01MJ4R3SQ
  consent:
    title: Cookie consent
    description: >-
      We use cookies to measure how effective our content is and whether you
      find what you're looking for. With your consent, you help make these
      learning sites better. You can change your choice at any time.
    cookies:
      analytics:
        name: Google Analytics
        checked: false
    actions:
      - accept
      - reject
      - manage
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bradpenney
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/bradpenney
    - icon: fontawesome/solid/globe
      link: https://bradpenney.io
    - icon: fontawesome/solid/rss
      link: https://tools.bradpenney.io/feed_rss_created.xml
extra_css:
  - stylesheets/extra.css
theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    scheme: slate
    primary: black
    accent: amber
  logo: images/exploring_software_development_tools.png
  favicon: images/exploring_software_development_tools.png
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.code.highlight
    - content.tooltips
    - content.code.mermaid

plugins:
  - search
  - meta
  - exclude:
      glob:
        # PUBLISHED (do NOT exclude): index.md, essentials/overview.md, essentials/git/git_basics.md,
        # essentials/git/git_collaboration.md, essentials/web/inspecting_http_traffic.md.
        # Everything below is a DRAFT — excluded from build, sitemap, and search.
        # To publish: remove its line here AND uncomment it in nav.
        # Essentials drafts
        - "essentials/jq_parsing_json.md"
        - "essentials/regex_for_sres.md"
        - "essentials/terminal_diagnostics.md"
        - "essentials/vim_survival_mode.md"
        - "essentials/yq_wrangling_yaml.md"
        # Efficiency — all draft
        - "efficiency/*"
        # Mastery — all draft
        - "mastery/*"
  - rss:
      match_path: ".*"
      pretty_print: true
      image: https://tools.bradpenney.io/images/exploring_software_development_tools.png
      abstract_chars_count: 160
      length: 20
      date_from_meta:
        as_creation: "date"
        as_update: "git"
        default_timezone: "America/Halifax"
      categories:
        - tags
      use_material_social_cards: false
  - social:
      cards: true
      cards_layout_options:
        background_color: "#1a202c"
        color: "#cbd5e0"
  - htmlproofer:
      enabled: true
      validate_rendered_template: true
      validate_external_urls: false
      raise_error: true
      raise_error_after_finish: true
      raise_error_excludes:
        404:
          - "#__consent"

markdown_extensions:
  - toc:
      permalink: "🔗"
      permalink_title: "Link to this section"
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - 📦 Essentials:
      - Overview: essentials/overview.md
      - Git Series:
          - Git Basics: essentials/git/git_basics.md
